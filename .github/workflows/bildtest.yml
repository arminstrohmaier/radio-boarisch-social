name: Bildtest

# Schritt 1 (LOP 127, D-083): 5 Testbilder mit Cloudflare Workers AI (FLUX.1 schnell)
# erzeugen und nach test/ auf den Branch committen, auf dem der Lauf startet.
# Laeuft beim Push dieser Datei bzw. von automat/bildgen.py und von Hand.
# Fehlen die Secrets, schlaegt der Lauf mit "Secret fehlt" fehl; nach dem Eintragen
# genuegt "Re-run all jobs" (ein erneuter Lauf liest die Secrets neu).
on:
  push:
    branches-ignore: [main, redaktion]
    paths: [".github/workflows/bildtest.yml", "automat/bildgen.py", "automat/bildsprache.py", "docs/bildsprache-muster.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bildtest-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  bilder:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # Branch-Spitze, auch bei "Re-run"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Betriebsweg pruefen (Lucid Origin, Bildsprache-Muster, Bildtext)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m automat.bildgen --betrieb test/betrieb/

      - name: Nach test/ committen
        if: always()   # auch nach 429 (Kontingent leer) die schon erzeugten Bilder sichern
        run: |
          git config user.name "radio-boarisch-automat"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/
          if git diff --cached --quiet; then echo "nichts Neues"; exit 0; fi
          git commit -m "Bildtest: Modellvergleich Workers AI"
          for i in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}" && exit 0
            sleep $((i * 5))
          done
          exit 1
