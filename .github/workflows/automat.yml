name: Automat

# Halbautomatik D-083: Entwurf -> Telegram (Ja/Nein) -> Meta Graph API.
#
# Betrieb als Kette von Dauerlaeufen: Jeder Lauf lauscht bis zu 340 Minuten per
# Long-Polling auf Telegram (Klicks in Sekunden), holt neue Entwuerfe/Themen selbst von
# allen Branches und startet am Ende seinen Nachfolger. Bewusst KEIN push- und KEIN
# schedule-Ausloeser: GitHub haelt pro concurrency-Gruppe nur einen wartenden Lauf und
# hat den wartenden Dauerlauf durch solche Kurzlaeufe verdraengt (11.11.2026).
# Reisst die Kette ab, startet die stuendliche Claude-Runde sie neu.
on:
  workflow_dispatch:
    inputs:
      testentwurf:
        description: "Testentwurf an Telegram schicken (bei Ja wird NICHTS veroeffentlicht)"
        type: boolean
        default: false
      dauer:
        description: "Minuten, die der Automat auf Telegram lauscht (0 = ein Durchlauf)"
        type: number
        default: 0
      telegramcheck:
        description: "Telegram-Verbindung pruefen (Ergebnis per Telegram)"
        type: boolean
        default: false
      metacheck:
        description: "Meta-Zugang pruefen (Ergebnis per Telegram, nichts wird veroeffentlicht)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # Nachfolger-Lauf starten

concurrency:
  group: automat
  cancel-in-progress: false

jobs:
  lauf:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # alle Branches, damit Entwuerfe von jedem Branch importiert werden

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Status-Branch 'redaktion' holen
        run: |
          git config --global user.name "radio-boarisch-automat"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin redaktion >/dev/null; then
            git worktree add --detach redaktion origin/redaktion
          else
            git worktree add --orphan -b redaktion redaktion
          fi

      - name: Telegram pruefen
        if: github.event_name == 'workflow_dispatch' && inputs.telegramcheck
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m automat.telegramcheck || true

      - name: Meta-Zugang pruefen
        if: github.event_name == 'workflow_dispatch' && inputs.metacheck
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_API_VERSION: ${{ vars.META_API_VERSION }}
        run: python -m automat.metacheck || true

      - name: Durchlauf
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_API_VERSION: ${{ vars.META_API_VERSION }}
        run: |
          python -m automat.lauf --status redaktion --commit --dauer "${{ inputs.dauer || 0 }}" \
            ${{ github.event_name == 'workflow_dispatch' && inputs.testentwurf && '--testentwurf' || '' }}

      - name: Nachfolger starten (Kette)
        if: ${{ success() && inputs.dauer && inputs.dauer != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run automat.yml --repo "${{ github.repository }}" --ref main -f dauer="${{ inputs.dauer }}"
